name: Secret Quarantine & Leak Prevention

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan-secrets:
    name: Gitleaks Scan & Secret Quarantine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Quarantine Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Fail Build if Hardcoded Tokens are Detected
        if: failure()
        run: |
          echo "::error::🚨 CRITICAL SECURITY ALERT: An unencrypted API key or token was detected in the commit!"
          echo "Please immediately revoke the compromised key and use Cloudflare Secrets (wrangler secret put) instead."
          exit 1

