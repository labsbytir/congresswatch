name: AI Changelog & Commit Annotator

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - '.github/workflows/auto-changelog.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog-and-comment:
    runs-on: ubuntu-latest
    if: github.repository == 'labsbytir/congresswatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate AI Summary via Together AI (Llama 3.3 70B)
        id: llama_summary
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node -e '
          const { execSync } = require("child_process");
          const fs = require("fs");

          async function run() {
            const commitSha = process.env.GITHUB_SHA;
            const apiKey = process.env.TOGETHER_API_KEY;

            // Get last commit message & git diff summary
            const logMsg = execSync("git log -1 --pretty=%B").toString().trim();
            const diffStat = execSync("git diff HEAD~1 HEAD --stat || git show --stat").toString().trim();

            console.log("Analyzing commit:", commitSha);
            console.log("Commit message:", logMsg);

            let aiSummary = "- " + logMsg.split("\n")[0];

            if (apiKey) {
              try {
                const prompt = `You are an automated changelog engineer for CongressWatch.
Analyze the following git commit message and diff statistics, and output 1-3 concise markdown bullet points categorized as Added, Changed, Fixed, or Security.
Do not include any conversational filler, quotes, or markdown codeblocks. Output only the bullet points.

Commit Message:
${logMsg}

Diff Stats:
${diffStat}
`;

                const res = await fetch("https://api.together.xyz/v1/chat/completions", {
                  method: "POST",
                  headers: {
                    "Authorization": "Bearer " + apiKey,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    model: "meta-llama/Llama-3.3-70B-Instruct-Turbo",
                    messages: [{ role: "user", content: prompt }],
                    temperature: 0.1,
                    max_tokens: 300
                  })
                });

                if (res.ok) {
                  const data = await res.json();
                  aiSummary = data.choices[0].message.content.trim();
                } else {
                  console.warn("Together AI returned non-200, falling back to git message.");
                }
              } catch (err) {
                console.warn("Error calling Together AI:", err);
              }
            }

            fs.writeFileSync("ai_summary.txt", aiSummary);
          }
          run();
          '

      - name: Post AI Comment on Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY=$(cat ai_summary.txt)
          gh api             --method POST             -H "Accept: application/vnd.github+json"             /repos/${{ github.repository }}/commits/${{ github.sha }}/comments             -f body="### 🤖 Llama 3.3 70B Automated Commit Summary

          $SUMMARY" || echo "Note: Commit comment posting skipped or unavailable."

      - name: Update CHANGELOG.md
        run: |
          SUMMARY=$(cat ai_summary.txt)
          DATE=$(date +'%Y-%m-%d')
          
          # Inject new bullet point under [Unreleased] section
          node -e '
          const fs = require("fs");
          const summary = fs.readFileSync("ai_summary.txt", "utf-8").trim();
          let changelog = fs.readFileSync("CHANGELOG.md", "utf-8");

          const marker = "## [Unreleased]\n";
          if (changelog.includes(marker)) {
            changelog = changelog.replace(marker, marker + "\n" + summary + "\n");
            fs.writeFileSync("CHANGELOG.md", changelog);
          }
          '

      - name: Commit & Push Changelog Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): auto-update from commit ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin main

