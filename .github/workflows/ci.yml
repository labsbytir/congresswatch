name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Types & Schema Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check
        run: npm run typecheck --if-present

      - name: Lint Check
        run: npm run lint --if-present

      - name: Validate D1 Migrations
        run: npx wrangler d1 migrations list DB --local || true

